# Bluetooth name
CONFIG_ZMK_KEYBOARD_NAME="Foxy Paws"
# Uncomment the following line to enable the Corne Display
CONFIG_ZMK_DISPLAY=y
# Better bluetooth stability and connect via pin
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Enable power management
# Turn off peripherals (30 seconds)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Sleep (turn off bluetooth - 4 hours)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=14400000
CONFIG_ZMK_PM_SOFT_OFF=y
# Enable Mouse Emulation
CONFIG_ZMK_POINTING=y
# 1.25ms multiplier for shortest time interval between updates 
# https://github.com/zmkfirmware/zmk/issues/2661
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
# Animation speed for slideshow - 30 seconds per picture (30 total)
CONFIG_CUSTOM_ANIMATION_SPEED=900000
